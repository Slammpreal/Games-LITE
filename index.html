<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blazer</title>
    <link rel="stylesheet" href="/main.css">
    <link rel="stylesheet" href="https://site-assets.fontawesome.com/releases/v6.2.0/css/all.css">
    <script>
        function create(url) {
            var win = window.open();
            win.document.body.style.margin = '0';
            win.document.body.style.height = '100vh';

            var iframe = win.document.createElement('iframe');
            iframe.style.border = 'none';
            iframe.style.width = '100%';
            iframe.style.height = '100%';
            iframe.style.margin = '0';
            iframe.src = url;

            win.document.body.appendChild(iframe);
        }
    </script>
</head>
<body>
    <nav>
        <img src="images/logo.png" alt="logo">
        <h1>BLAZER</h1>
    </nav>

    <div class="featured">
        <h1>Popular:</h1>
        <div class="column">
            <a href="#" onclick="create('games/bob-the-robber-2/'); return false;">
                <img src="images/bob-the-robber-2.png">
                <div class="play-button">
                    <i class="fa-solid fa-play"></i>
                </div>
            </a>
            <a href="#" onclick="create('games/vex7/'); return false;">
                <img src="images/vex7.jpeg">
                <div class="play-button">
                    <i class="fa-solid fa-play"></i>
                </div>
            </a>
            <a href="#" onclick="create('games/minecraft/'); return false;">
                <img src="images/mc.png" alt="Minecraft">
                <div class="play-button">
                    <i class="fa-solid fa-play"></i>
                </div>
            </a>
        </div>
        <div class="row">
            <a href="#" onclick="create('games/drive-mad/'); return false;">
                <img src="images/drive-mad.jpg">
                <div class="play-button">
                    <i class="fa-solid fa-play"></i>
                </div>
            </a>
        </div>
        <div class="column">
            <a href="#" onclick="create('games/moto-x3m/'); return false;">
                <img src="images/moto-x3m.jpg">
                <div class="play-button">
                    <i class="fa-solid fa-play"></i>
                </div>
            </a>
            <a href="#" onclick="create('games/retro-bowl/'); return false;">
                <img src="images/retro-bowl.jpg">
                <div class="play-button">
                    <i class="fa-solid fa-play"></i>
                </div>
            </a>
        </div>
    </div>

    <div class="content">
        <hr>

        <div class="search">
            <input type="text" placeholder="Search..." oninput="">
            <button><i class="fas fa-search"></i></button>
        </div>

        <div id="games">
            <a href="#" onclick="create('games/bob-the-robber-2/'); return false;">
                <img src="images/bob-the-robber-2.png" alt="bob the robber 2">
            </a>
            <a href="#" onclick="create('games/vex7/'); return false;">
                <img src="images/vex7.jpeg" alt="vex 7">
            </a>
            <a href="#" onclick="create('games/minecraft/'); return false;">
                <img src="images/mc.png" alt="Minecraft">
            </a>
            <a href="#" onclick="create('games/moto-x3m/'); return false;">
                <img src="images/moto-x3m.jpg" alt="moto x3m">
            </a>
            <a href="#" onclick="create('games/retro-bowl/'); return false;">
                <img src="images/retro-bowl.jpg" alt="retrobowl">
            </a>
            <a href="#" onclick="create('games/drive-mad/'); return false;">
                <img src="images/drive-mad.jpg" alt="drive mad">
            </a>
            <a href="#" onclick="create('games/slope/'); return false;">
                <img src="images/slope.jpg" alt="slope">
            </a>
            <a href="#" onclick="create('games/motox3m2/'); return false;">
                <img src="images/motox3m2.jpg" alt="moto x3m2">
            </a>
        </div>
    </div>
</body>
</html>
