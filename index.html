<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Games Lite Notice</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <style>
    :root {
      --bg: #0d0d0d;
      --card: #1a1a1a;
      --text: #ffffff;
      --accent: #4f8cff;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: "Poppins", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
    }
    .container {
      background: var(--card);
      padding: 40px;
      border-radius: 20px;
      max-width: 600px;
      width: 90%;
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 15px;
    }
    p {
      font-size: 1.1rem;
      line-height: 1.6;
    }
    a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
    .btn {
      display: inline-block;
      margin-top: 25px;
      padding: 12px 22px;
      background: var(--accent);
      color: white;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      transition: 0.2s;
    }
    .btn:hover {
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Games Lite is No Longer Maintained</h1>
    <p>
      Please use the new and improved
      <a href="https://zgcv2.netlify.app" target="_blank">Zayaans Game Corner</a>.
    </p>
    <p>
      Games Lite will be taken down by <strong>2026</strong>. Thank you for your support and for being part of this project.
    </p>
    <a class="btn" href="homepage.html">Continue to Games Lite</a>
  </div>
</body>
</html>
